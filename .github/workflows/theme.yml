name: Tukar gaya laman (asal / stripe / apple / racing)

# Dua cara:
# 1. Manual: Actions -> "Tukar gaya laman" -> Run workflow -> pilih asal / stripe / apple / racing.
# 2. Automatik: semakan setiap hari 12:05 pagi (waktu Malaysia). Bila gaya sekarang dah 15 hari,
#    tukar ke gaya seterusnya dalam senarai GILIRAN (ikut urutan, kemudian kembali ke awal). Tukar manual = kiraan 15 hari bermula semula.

on:
  workflow_dispatch:
    inputs:
      gaya:
        description: "Pilih gaya laman untuk semua pelawat"
        type: choice
        options:
          - asal
          - stripe
          - apple
          - racing
        default: asal
  schedule:
    - cron: "5 16 * * *"   # 16:05 UTC = 12:05 pagi waktu Malaysia

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  HARI_GILIRAN: 15
  # Gaya yang ikut giliran automatik, ikut urutan (asal -> stripe -> apple -> racing -> asal ...).
  GILIRAN: "asal stripe apple racing"

jobs:
  tukar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # perlu sejarah penuh untuk tahu bila gaya terakhir ditukar
      - name: Tentukan gaya
        id: pilih
        run: |
          cur=$(sed -n 's/^window.SITE_THEME = "\(.*\)";/\1/p' site-config.js)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "gaya=${{ inputs.gaya }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git log -1 --format=%ct -- site-config.js)
          # kira hari kalendar waktu Malaysia (UTC+8), supaya tukar tepat hari ke-15 pukul 12:05 pagi
          days=$(( ($(date +%s) + 28800) / 86400 - (last + 28800) / 86400 ))
          echo "Gaya sekarang: $cur, sudah $days hari"
          if [ "$days" -lt "$HARI_GILIRAN" ]; then
            echo "Belum cukup $HARI_GILIRAN hari, tiada perubahan."
            echo "gaya=" >> "$GITHUB_OUTPUT"
          else
            # gaya seterusnya dalam GILIRAN; jika gaya sekarang tiada dalam senarai, mula dari yang pertama
            set -- $GILIRAN; first=$1; next=$first; found=0
            for g in "$@"; do if [ "$found" = 1 ]; then next=$g; found=2; break; fi; [ "$g" = "$cur" ] && found=1; done
            [ "$found" = 1 ] && next=$first
            echo "Tukar $cur -> $next"
            echo "gaya=$next" >> "$GITHUB_OUTPUT"
          fi
      - name: Tetapkan gaya
        if: steps.pilih.outputs.gaya != ''
        run: |
          sed -i "s/^window.SITE_THEME = \".*\";/window.SITE_THEME = \"${{ steps.pilih.outputs.gaya }}\";/" site-config.js
          # gaya sama seperti sekarang: jangan ubah apa-apa (elak commit kosong)
          if git diff --quiet -- site-config.js; then echo "Gaya sudah ${{ steps.pilih.outputs.gaya }}"; exit 0; fi
          v=$(date +%s)
          sed -i -E "s/site-config\.js\?v=[0-9]+/site-config.js?v=$v/" index.html en/index.html
          cat site-config.js
      - name: Simpan & terbitkan
        if: steps.pilih.outputs.gaya != ''
        run: |
          git add site-config.js index.html en/index.html
          if git diff --cached --quiet; then echo "Gaya sudah ${{ steps.pilih.outputs.gaya }}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "schedule" ]; then how="automatik 15 hari"; else how="manual"; fi
          git commit -m "Gaya laman: ${{ steps.pilih.outputs.gaya }} ($how)"
          git pull --rebase -q
          git push
