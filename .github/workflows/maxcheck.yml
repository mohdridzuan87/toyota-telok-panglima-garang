name: Kemas kini jadual service Maxcheck

# Setiap 7 hari (Isnin 9:30 pagi waktu Malaysia): baca laman Maxcheck Toyota Malaysia, jana semula gambar
# jadual yang berubah, dan terbitkan. Boleh juga dijalankan manual (Run workflow).
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  maxcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pasang pustaka PDF & gambar
        run: pip install -q "pymupdf>=1.24" "pillow>=10"
      - name: Ambil jadual Maxcheck terkini
        run: python scripts/maxcheck.py
      - name: Gambar sisi kereta (menu Models Toyota) untuk kad model
        run: python scripts/sides.py || echo "::warning::gambar sisi gagal, guna yang lama"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Jana semula halaman Maxcheck (/maxcheck/)
        run: node scripts/seo.mjs
      - name: Commit jika berubah
        id: commit
        run: |
          git add -A img/side maxcheck pricelist en harga llms.txt sitemap.xml index.html
          if git diff --cached --quiet; then echo "Tiada perubahan"; echo "pushed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Jadual Maxcheck dikemas kini automatik ($(date -u +%F))"
          git pull --rebase -q
          git push
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
      - name: Sahkan laman langsung sudah guna data baru
        if: steps.commit.outputs.pushed == 'yes'
        run: |
          want=$(grep -o '"checkedAt":"[0-9-]*"' maxcheck/data.js)
          for i in $(seq 1 20); do
            got=$(curl -s "https://wanjasni.my/maxcheck/data.js?nc=$RANDOM" | grep -o '"checkedAt":"[0-9-]*"' || true)
            if [ "$got" = "$want" ]; then echo "Laman langsung terkini: $got"; exit 0; fi
            sleep 30
          done
          echo "::error::Laman wanjasni.my belum guna data Maxcheck baru selepas 10 minit (dijangka $want, dapat '$got')."
          exit 1
