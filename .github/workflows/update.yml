name: Kemas kini data Toyota (model, harga, rebate, warna)

on:
  schedule:
    - cron: "0 1 1,7,15,28 * *"   # 1hb, 7hb, 15hb & 28hb setiap bulan, 9:00 pagi waktu Malaysia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Alat PDF & gambar
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils webp ffmpeg >/dev/null
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Ambil data terkini dari toyota.com.my (+ gambar warna Toyota Thailand)
        run: node scripts/update.mjs
      - name: Commit jika berubah
        id: commit
        run: |
          git add -A data.js data img/col img/cut sitemap.xml llms.txt harga en maxcheck pricelist index.html
          if git diff --cached --quiet; then echo "Tiada perubahan"; echo "pushed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data Toyota dikemas kini automatik ($(date -u +%F))"
          git push
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
      - name: Sahkan laman langsung sudah guna data baru
        if: steps.commit.outputs.pushed == 'yes'
        run: |
          want=$(grep -o '"checkedAt":"[0-9-]*"' data.js)
          for i in $(seq 1 20); do
            got=$(curl -s "https://wanjasni.my/data.js?nc=$RANDOM" | grep -o '"checkedAt":"[0-9-]*"' || true)
            if [ "$got" = "$want" ]; then echo "Laman langsung terkini: $got"; exit 0; fi
            sleep 30
          done
          echo "::error::Laman wanjasni.my belum guna data baru selepas 10 minit (dijangka $want, dapat '$got'). Semak GitHub Pages."
          exit 1
