name: Kemas kini data Toyota (model, harga, rebate, warna)

on:
  schedule:
    - cron: "0 1 1,7,15,28 * *"   # 1hb, 7hb, 15hb & 28hb setiap bulan, 9:00 pagi waktu Malaysia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Alat PDF & gambar
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils webp ffmpeg >/dev/null
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Ambil data terkini dari toyota.com.my
        run: node scripts/update.mjs
      - name: Commit jika berubah
        run: |
          git add -A data.js data img/col
          if git diff --cached --quiet; then echo "Tiada perubahan"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data Toyota dikemas kini automatik ($(date -u +%F))"
          git push
